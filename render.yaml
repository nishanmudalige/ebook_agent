services:
  - type: web
    name: ebook-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VECTOR_STORE_ID
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: EBOOK_AGENT_ACCESS_CODE
        sync: false
